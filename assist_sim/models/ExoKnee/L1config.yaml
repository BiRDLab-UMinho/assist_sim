device:
  name: "ExoKnee_L1"
  model_xml: "L1model.xml"
  compatible_msk: [myolegs22, myolegs26, myolegs, myofullbody]

attachments:
  - device_body: "thigh_orth"
    parent_body: "femur_l"
  - device_body: "motor"
    parent_body: "femur_l"
  - device_body: "shank_orth"
    parent_body: "tibia_l"

actuators:
  - name: "Motor"
    joint: "knee_angle_l"
    gaintype: "fixed"
    gainprm: [20, 0, 0]
    ctrlrange: [-1, 1]
    ctrllimited: true
    gear: [1.0]

contact:
  pairs:
    default:
      - {geom1: "thigh_orth_geom", geom2: "femur_l_geom_1"}
      - {geom1: "shank_orth_geom", geom2: "tibia_l_geom_2"}
    myolegs:
      - {geom1: "thigh_orth_geom", geom2: "femur_l"}
      - {geom1: "shank_orth_geom", geom2: "tibia_l"}
    myofullbody:
      - {geom1: "thigh_orth_geom", geom2: "femur_l"}
      - {geom1: "shank_orth_geom", geom2: "tibia_l"}

sensors: 
  - {name: "thigh_int", type: force, site: thigh_force}
  - {name: "shank_int", type: force, site: shank_force}
